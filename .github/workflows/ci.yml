name: Java CI with Playwright

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install Maven dependencies
        run: mvn -B dependency:resolve

      # NPX method use kar rahe hain kyunki Maven plugin artifact issue de raha tha
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run tests
        # ensure kar rahe hain ki failure par bhi pipeline agle step par jaye (reports ke liye)
        continue-on-error: true
        run: mvn -B test

      # Test results (Allure) ko save karne ke liye
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7